# Qwen3-8B 4-class SFT Configuration (ms-swift)
#
# References:
#   - ms-swift Qwen3 Best Practice: https://swift.readthedocs.io/en/latest/BestPractices/Qwen3-Best-Practice.html
#   - Qwen official training guide: https://qwen.readthedocs.io/en/latest/training/ms_swift.html
#   - ms-swift CLI params: https://swift.readthedocs.io/en/v3.8/Instruction/Command-line-parameters.html
#
# Dataset: ~2624 samples (1312 faithful + 1312 hallucination, 4-class)
# Token lengths: min=477, mean=2783, P95=~5700, max=7542 (Qwen3 tokenizer, train data)

model: Qwen/Qwen3-8B
train_type: lora
torch_dtype: bfloat16

# LoRA settings
# - rank 8, alpha 32 (ratio 4): ms-swift default, Qwen3 Best Practice 권장값
# - all-linear: q/k/v/o_proj + gate/up/down_proj (lm_head, embed 제외)
# - dropout 0.05: ms-swift default, 소규모 데이터 오버피팅 방지
lora_rank: 8
lora_alpha: 32
target_modules: all-linear
lora_dropout: 0.05

# Training hyperparameters
# - lr 1e-4: ms-swift LoRA default, Qwen3 Best Practice 권장
# - cosine scheduler: ms-swift default
# - 8 GPUs × batch 2 × grad_accum 2 = effective batch size 32
# - total steps = (2362 * 3) / 32 ≈ 222, warmup = ~11 steps
# - weight_decay 0.1: ms-swift default, 오버피팅 방지
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.1

# max_length: train 데이터 실측 기준 max=7542 토큰
# 8192면 전체 커버
# A6000 48GB 기준 batch_size=2 + LoRA + 8192 max_length + DDP → 메모리 안전
max_length: 8192

# DataLoader: 멀티프로세스 데이터 로딩으로 GPU idle 최소화
dataloader_num_workers: 4
dataloader_pin_memory: true

# Gradient checkpointing: 메모리 절약 (ms-swift default=true)
gradient_checkpointing: true

# Evaluation & saving
# - 2362 samples / 32 batch = ~74 steps/epoch, ~222 total
# - eval_steps 25: epoch당 ~3회 평가
# - save_total_limit 5: 디스크 절약
eval_steps: 25
save_steps: 25
save_total_limit: 5
logging_steps: 5

# Qwen3 thinking mode 비활성화 (분류 태스크에 불필요)
# - 학습 데이터에 빈 <think> 태그 포함 시 사용
# - 빈 think 태그의 loss 제외하여 reasoning 능력 보존
loss_scale: ignore_empty_think

# Task
classification_type: fourclass

# Model cache (set HF_CACHE env var to customize, or uses HuggingFace default)
# model_cache_dir: /path/to/huggingface/hub
